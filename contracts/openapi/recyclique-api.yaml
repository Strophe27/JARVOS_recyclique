        schema:
          type: string
          title: Site Id
      - name: module_key
        in: path
        required: true
        schema:
          type: string
          title: Module Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleConfigDocument'
        '401':
          description: Non authentifié
        '403':
          description: Interdit pour ce site ou ce rôle
        '404':
          description: Site ou module inconnu
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      description: '**API interne Recyclique** (tag `ModuleConfig`) : non stable pour applications JARVOS externes tant que
        Story 9.6 n''est pas livree.

        Reponse **specifique au tenant et au sujet authentifie** ; en-tetes cache appropries (`private` ou `no-store` selon
        politique).

        Le serveur ne doit pas faire confiance au seul `site_id` d''URL : verifier **membership** et **droits sur `module_key`**.

        '
    patch:
      tags:
      - ModuleConfig
      summary: Mettre a jour la configuration d'un module pour un site
      operationId: recyclique_moduleConfig_patchSiteModuleConfig
      security:
      - HTTPBearer: []
      parameters:
      - name: site_id
        in: path
        required: true
        schema:
          type: string
          title: Site Id
      - name: module_key
        in: path
        required: true
        schema:
          type: string
          title: Module Key
      - name: If-Match
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: If-Match
      - name: X-Module-Config-Change-Reason
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Module-Config-Change-Reason
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModuleConfigDocument'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleConfigDocument'
        '401':
          description: Non authentifié
        '403':
          description: Interdit pour ce site ou ce rôle
        '404':
          description: Site ou module inconnu
        '409':
          description: Conflit If-Match
        '422':
          description: Corps invalide ou hors schéma
      description: '**API interne Recyclique** (tag `ModuleConfig`) : non stable pour applications JARVOS externes tant que
        Story 9.6 n''est pas livree.

        Corps valide contre le JSON Schema du **module** et de sa **schema_version**.

        **If-Match** : pour une detection stricte des conflits, envoyer la valeur **ETag** du dernier GET ;

        si elle ne correspond pas a la version persistee -> **409**. Si **If-Match** est **absent**, le comportement

        doit etre defini explicitement a l''implementation (ex. derniere ecriture gagnante toleree, ou refus **428**

        / erreur metier si politique stricte - a figer avant implementation).

        Rejet taille corps / profondeur **avant** travail couteux (reject-early). Limites globales du document

        JSON sont imposees **cote serveur** (middleware / parse borne) : voir `references/config-modules-site-id/livrable-normatif-architecture.md`.

        '
