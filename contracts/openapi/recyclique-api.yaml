  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
    RecycliqueWebSessionCookie:
      type: apiKey
      in: cookie
      name: recyclique_access
      description: Session web v2 — alternative ou complément au Bearer pour les clients navigateur.
    bearerOrCookie:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT d''accès. Alternative same-origin : cookie httpOnly `recyclique_access` (nom par défaut serveur),
        sans duplication de la logique d''autorisation côté client.

        '
    adminSessionStrict:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Même transport JWT que `bearerOrCookie` (header **Authorization: Bearer** ou cookie httpOnly d''accès).

        Story 16.2 : routes observabilité utilisent `require_admin_role_strict()` → `get_current_user_strict` :

        **403** « Not authenticated » si ni Bearer ni cookie (au lieu du **401** typique de `require_admin_role` sans jeton).

        Toujours exiger ensuite rôle ADMIN ou SUPER_ADMIN (403 « Accès refusé - rôle administrateur requis » si USER).

        '
  parameters:
    RecycliqueContextSiteIdHeader:
      name: X-Recyclique-Context-Site-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: '**Story 25.8** — Dernier `context.site_id` connu côté client (`ContextEnvelope`). Si l''en-tête est

        envoyé, il doit correspondre à la vérité serveur ; sinon **409** avec `code` **`CONTEXT_STALE`**

        (corps `RecycliqueApiError`).

        '
    RecycliqueContextCashSessionIdHeader:
      name: X-Recyclique-Context-Cash-Session-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: '**Story 25.8** — Dernier `context.cash_session_id` connu côté client. Si présent, doit correspondre

        à l''enveloppe serveur courante ; sinon **409** `CONTEXT_STALE`.

        '
