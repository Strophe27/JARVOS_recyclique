  /v1/admin/accounting-expert/payment-methods/{payment_method_id}/active:
    post:
      tags:
      - admin
      - accounting-expert
      summary: Activer ou désactiver un moyen (step-up PIN requis)
      operationId: accountingExpertSetPaymentMethodActive
      security:
      - HTTPBearer: []
      parameters:
      - name: payment_method_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Payment Method Id
      - name: active
        in: query
        required: true
        schema:
          type: boolean
          description: true = actif, false = inactif
          title: Active
        description: true = actif, false = inactif
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethodExpertResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      description: 'Stories **22.3** (fondation API) et **23.2** (Peintre) — la désactivation est toujours possible ; si une
        session ouverte

        utilise encore le moyen, l’UI peut prévenir via `GET …/open-session-usage`. Audit `accounting_payment_method_changed`.

        '
  /v1/admin/accounting-expert/payment-methods/{payment_method_id}/open-session-usage:
    get:
      tags:
      - admin
      - accounting-expert
      summary: Usage du moyen dans une session ouverte (lecture)
      operationId: accountingExpertGetPaymentMethodOpenSessionUsage
      security:
      - HTTPBearer: []
      parameters:
      - name: payment_method_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Payment Method Id
      - name: site_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: Si fourni, ne considère que les sessions ouvertes de ce site (alignement contexte caisse).
          title: Site Id
        description: Si fourni, ne considère que les sessions ouvertes de ce site (alignement contexte caisse).
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethodOpenSessionUsageResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      description: 'Indique si le moyen est encore utilisé par un `payment_transaction` lié à une session **ouverte** — pour
        afficher

        un avertissement avant désactivation (les ventes en cours ne sont pas bloquées).

        Si `site_id` est fourni, seules les sessions ouvertes de ce site sont prises en compte.

        '
  /v1/admin/accounting-expert/revisions:
