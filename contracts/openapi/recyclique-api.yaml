      type: object
      description: '**Contrat gelé (Story 2.6 — codegen / types partagés)** : présence des champs nommés ci-dessous,

        types des enums `SyncStateCore` et `cash_session_effectiveness`, structure de `context` via

        `ExploitationContextIds`, champ `observed_at` (date-time ISO 8601), et cohérence `sync_operational_summary`

        quand l''objet est non null (sous-objet minimal `worst_state` + `source_reachable`).


        **Complété Story 2.7 (sémantique HTTP + agrégats)** : `daily_kpis_aggregate` reprend les clés de

        `UnifiedLiveStatsResponse` / `GET /v1/stats/live` (période `daily` côté impl) : `tickets_count`,

        `last_ticket_amount`, `ca`, `donations`, `weight_out_sales`, `tickets_open`, `tickets_closed_24h`,

        `items_received`, `weight_in`, `weight_out`, `period_start`, `period_end` (date-time ISO en JSON).

        `effective_open_state` : codes stables `open`, `closed`, `unknown`, `not_applicable`, et pour F2

        `delayed_open` / `delayed_close` lorsque `sites.configuration.opening_exception` le porte.

        Runtime `forbidden` : `context` omis, `daily_kpis_aggregate` null, `sync_operational_summary` null,

        `cash_session_effectiveness` = `unknown` (pas d''inference silencieuse UX-DR15).


        **Story 4.5** : `bandeau_live_slice_enabled` — vérité `sites.configuration.bandeau_live_slice_enabled`

        (defaut true si absent). Si `false`, pas d''agrégats KPIs dans cette réponse ; champs d''état

        alignés sur une surface minimale (`not_applicable`, sync null).


        **Story 8.2** : `sync_operational_summary.deferred_remote_retry` — au moins une ligne outbox du site

        en backoff (`next_retry_at` futur, `pending`).


        **REL-01 / SNAP-01** : `sync_aggregate_unavailable` (booléen optionnel) — true lorsque l’agrégat outbox

        SQL n’a pas pu être calculé honnêtement ; dans ce cas `sync_operational_summary` est null (pas de

        `resolu` factice). `sync_operational_summary.partial_success` (optionnel) signale un batch clôture

        avec livraison partielle Paheko au niveau site.


        Absence vs null : artefact 1.7 section 6.

        '
      properties:
        bandeau_live_slice_enabled:
          type: boolean
          description: 'True = slice actif ; False = désactivé par admin (config site). Defaut cote client si cle absente
            du JSON : true.

            '
        daily_kpis_aggregate:
          type: object
          nullable: true
          description: 'KPIs jour agreges (multi-sites, multi-caisses), meme esprit bandeau recyclique 1.4.4 — voir artefact
            07 §1 bis.

            Clefs figees Story 2.7 : alignement `UnifiedLiveStatsResponse` (meme moteur que `ReceptionLiveStatsService.get_unified_live_stats`,
            perimetre site quand `context.site_id` est connu). Snapshot JSON 1.4.4 : references/artefacts/2026-04-02_08_openapi-recyclique-live-recyclic-local.json
            (lecture seule, pas contrat v2).

            '
          additionalProperties: true
        context:
          $ref: '#/components/schemas/ExploitationContextIds'
        effective_open_state:
          type: string
          description: 'Verite metier fenetre d''ouverture effective au sens terrain (backend, famille F1/F3).

            F2 (ouverture decalee / exception) : `delayed_open` / `delayed_close` lorsque la regle serveur

            les calcule (ex. hint `sites.configuration.opening_exception`).

            '
        cash_session_effectiveness:
          type: string
          description: 'Distinct de la simple selection de contexte (UX-DR15). Jamais infere depuis l''existence d''une entite
            caisse seule.

            '
          enum:
          - open_effective
          - closed_effective
          - unknown
          - not_applicable
        sync_operational_summary:
          type: object
          nullable: true
          description: Famille F4 — observabilite sans redefinir FR24.
          properties:
            worst_state:
              $ref: '#/components/schemas/SyncStateCore'
            source_reachable:
              type: boolean
            deferred_remote_retry:
              type: boolean
              description: True si backoff actif sur au moins une ligne outbox du site (Story 8.2).
            partial_success:
              type: boolean
              nullable: true
              description: 'SNAP-01 — true si au moins une ligne outbox du site a un snapshot batch avec livraison partielle

                Paheko ; false si des snapshots batch existent mais aucun partiel ; null si aucun snapshot batch.

                '
          additionalProperties: false
        sync_aggregate_unavailable:
          type: boolean
          description: 'REL-01 — true si l’agrégat outbox par site n’a pas pu être obtenu (erreur SQL, schéma incomplet).

            Dans ce cas `sync_operational_summary` doit être null.

            '
        observed_at:
          type: string
          format: date-time
          description: Horodatage serveur autoritaire pour affichage coherent (AR39).
      additionalProperties: false
    ExploitationLiveSnapshotResponse:
      properties:
        bandeau_live_slice_enabled:
          type: boolean
          title: Bandeau Live Slice Enabled
          description: 'Story 4.5 — vérité site (`sites.configuration.bandeau_live_slice_enabled`). False : module bandeau
            live désactivé par configuration admin ; pas d''agrégats KPIs dans cette réponse.'
          default: true
        observed_at:
          type: string
          format: date-time
          title: Observed At
          description: Horodatage serveur autoritaire (AR39).
        effective_open_state:
          type: string
          title: Effective Open State
          description: 'Vérité métier fenêtre d’ouverture (F1/F3). Valeurs stables usuelles : open, closed, unknown, not_applicable
            ; F2 (ouverture décalée / exception) : delayed_open, delayed_close lorsque la règle métier les calcule.'
        cash_session_effectiveness:
          $ref: '#/components/schemas/CashSessionEffectiveness'
        daily_kpis_aggregate:
          anyOf:
          - type: object
          - type: 'null'
          title: Daily Kpis Aggregate
          description: Agrégats jour (clés figées Story 2.7, alignées UnifiedLiveStats / bandeau 1.4.4).
        context:
          anyOf:
          - $ref: '#/components/schemas/ExploitationContextIdsOut'
          - type: 'null'
          description: Projection ids contexte effectif (Story 2.2/2.3) ; absent si forbidden.
        sync_operational_summary:
          anyOf:
          - $ref: '#/components/schemas/SyncOperationalSummaryOut'
          - type: 'null'
          description: F4 — null si signal sync non exposable honnêtement.
        sync_aggregate_unavailable:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Sync Aggregate Unavailable
          description: REL-01 — true si l’agrégat outbox par site n’a pas pu être calculé ; `sync_operational_summary` doit
            alors être null.
      additionalProperties: false
      type: object
      required:
      - observed_at
      - effective_open_state
      - cash_session_effectiveness
      title: ExploitationLiveSnapshotResponse
      description: Réponse GET /v2/exploitation/live-snapshot (bandeau live minimal).
