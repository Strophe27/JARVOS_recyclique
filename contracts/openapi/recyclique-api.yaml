    ContextEnvelope:
      type: object
      required:
      - runtime_state
      - permission_keys
      - computed_at
      description: 'Enveloppe canonique backend (AR39). Story 2.2 : minimal ; Story 2.3 enrichit le calcul de `permission_keys`.

        Story 5.5 : `presentation_labels` (optionnel) porte uniquement de la présentation pour résoudre des `label_key` CREOS
        ;

        ne remplace ni permissions, ni routes, ni `page_key`. Rétrocompat : champs optionnels, clients existants ignorables.

        '
      properties:
        runtime_state:
          $ref: '#/components/schemas/ContextRuntimeState'
        context:
          allOf:
          - $ref: '#/components/schemas/ExploitationContextIds'
          nullable: true
        permission_keys:
          type: array
          items:
            type: string
          description: 'Clés de permission effectives à l''instant `computed_at` (union additive Story 2.3 ;

            aligné sur `GET /v1/users/me/permissions` pour le même utilisateur et session).

            **Story 6.8** : la clé `caisse.sale_correct` est ajoutée côté serveur uniquement pour les profils

            **super-admin** (surface UI correction vente ; l''endpoint reste toutefois contrôlé par rôle serveur).

            '
        computed_at:
          type: string
          format: date-time
          description: Horodatage serveur autoritaire.
        restriction_message:
          type: string
          nullable: true
          description: Détail lisible pour `degraded` / `forbidden` (diagnostic UI, non normatif pour l'autorisation).
        presentation_labels:
          type: object
          nullable: true
          description: 'Map `label_key` (declare dans les manifests CREOS, ex. navigation) vers libelle affichable UTF-8.

            Presentation uniquement : le runtime n''utilise pas ce champ pour autoriser ou masquer des entrees.

            Cle supplementaire serveur (Epic 14.1) : `context.active_site_display_name` — nom convivial du site

            d''exploitation courant lorsque `context.site_id` est resolu en base (pas d''UUID expose en UI).

            '
          additionalProperties:
            type: string
      additionalProperties: false
    ContextEnvelopeResponse:
      properties:
        runtime_state:
          $ref: '#/components/schemas/ContextRuntimeState'
