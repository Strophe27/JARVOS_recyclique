        site_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Site Id
        outbox_status:
          type: string
          title: Outbox Status
          description: 'Cycle technique : pending, processing, delivered, failed (distinct de sync_state_core).'
        sync_state_core:
          $ref: '#/components/schemas/SyncStateCore'
        local_session_persisted:
          type: boolean
          title: Local Session Persisted
          description: 'True : clôture locale enregistrée (présence de la ligne outbox liée à une session clôturée). Ne signifie
            pas « sync Paheko OK ».'
          default: true
        remote_attempt_count:
          type: integer
          title: Remote Attempt Count
          default: 0
        last_remote_http_status:
          anyOf:
          - type: integer
          - type: 'null'
          title: Last Remote Http Status
          description: Statut HTTP de la dernière tentative Paheko ; null si aucune tentative réseau (ex. non configuré).
        last_error:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Error
        next_retry_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Next Retry At
          description: Prochain créneau éligible pour tentative distante (backoff 8.2).
        rejection_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Rejection Reason
          description: Motif si sync_state_core=rejete (POST /reject).
        mapping_resolution_error:
          anyOf:
          - type: string
          - type: 'null'
          title: Mapping Resolution Error
          description: 'Story 8.3 — code d''échec de résolution mapping avant HTTP (ex. mapping_missing, mapping_disabled,

            session_not_found, site_missing, invalid_destination_params). Null si une tentative réseau Paheko a eu lieu ou
            N/A.

            '
        root_cause_domain:
          type: string
          enum:
          - mapping
          - builder
          - outbox_http
          title: Root Cause Domain
          description: 'Story 25.10 — taxonomie canonique **déterministe** (spec 25.4 §4 ; Epic 8 supervision 8.3–8.6). Valeurs
            possibles : `mapping` (préconditions / résolution mapping 8.3), `builder` (construction payload/batch depuis snapshot),
            `outbox_http` (transport HTTP Paheko, retries/terminal). Règles : mapping > builder > outbox_http, sans heuristique
            floue (pas de parsing `last_error`).'
        root_cause_code:
          type: string
          minLength: 1
          title: Root Cause Code
          description: 'Story 25.10 — code stable de cause racine, dérivé sans heuristique (priorité mapping > builder > outbox_http).

            Exemples : `mapping_missing`, `batch_build_failed`, `http_403`.

            '
        root_cause_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Root Cause Message
          description: 'Story 25.10 — message de contexte **stable** quand disponible (ex. `payload.preparation_trace_v1.message`).

            Null si non applicable (ex. échecs purement HTTP).

            '
        correlation_id:
          type: string
          title: Correlation Id
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
        transaction_preview:
          anyOf:
          - $ref: '#/components/schemas/PahekoResolvedTransactionPreview'
          - type: 'null'
          description: Résumé calculé de l'écriture comptable Paheko quand la résolution mapping est possible.
        close_batch_state:
          anyOf:
          - $ref: '#/components/schemas/PahekoCloseBatchStatePublic'
          - type: 'null'
          description: Story 22.7 — états des sous-écritures batch (présent si payload persisté côté transport).
      additionalProperties: false
      type: object
      required:
      - id
      - operation_type
      - idempotency_key
      - outbox_status
      - sync_state_core
      - root_cause_domain
      - root_cause_code
      - correlation_id
      - created_at
      - updated_at
      title: PahekoOutboxItemPublic
      description: 'Vue liste outbox Paheko (Stories 8.1–8.3). `outbox_status` = cycle technique ; `sync_state_core` = état
        métier FR24.

        `next_retry_at` : backoff ; `rejection_reason` : si `rejete`. **8.3** : `mapping_resolution_error` si échec **avant**

        tout POST Paheko (distinct des erreurs HTTP `last_remote_http_status`).

        **Story 25.10** : `root_cause_domain` / `root_cause_code` exposent une taxonomie canonique (mapping vs builder vs
        outbox_http),

        dérivée **sans heuristique floue** (pas de parsing `last_error`) à partir de signaux stables (trace préparation, transitions
        d''audit, HTTP).

        **Idempotence sortante Paheko** : en clôture simple (sans snapshot batch), chaque POST utilise `Idempotency-Key` =
        `idempotency_key`.

        **Story 22.7** : si `close_batch_state` est présent (snapshot `accounting_close_snapshot_frozen`), chaque sous-écriture
        envoie sa propre clé stable

        (`idempotency_sub_key` dans `close_batch_state.sub_writes`, dérivée de `idempotency_key` + index + nature de ligne).

        '
