          title: Revision Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountingRevisionDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      description: Stories **22.3** (API) et **23.2**/**23.3** (Peintre) — référence stable `id` pour chaîne 22.6 ; pas de
        substitution par « config courante ».
  /v1/admin/audit-log:
    get:
      tags:
      - admin
      - observability
      summary: Journal d'audit applicatif (admin, lecture transverse)
      description: '**G-OA-01** (Story 16.2). **Autorité** : `require_admin_role_strict()` (voir `adminTransactionLogsList`).

        **Lecture transverse** table `AuditLog` ; filtres query documentés alignés sur le handler.

        Rate limit : 30/minute (**429**).

        '
      operationId: adminAuditLogList
      security:
      - HTTPBearer: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Numéro de page
          default: 1
          title: Page
        description: Numéro de page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Taille de page
          default: 20
          title: Page Size
        description: Taille de page
      - name: action_type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filtrer par type d'action
          title: Action Type
        description: Filtrer par type d'action
      - name: actor_username
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filtrer par nom d'utilisateur acteur
          title: Actor Username
        description: Filtrer par nom d'utilisateur acteur
      - name: target_type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filtrer par type de cible
          title: Target Type
        description: Filtrer par type de cible
      - name: start_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Date de début (ISO format)
          title: Start Date
        description: Date de début (ISO format)
      - name: end_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Date de fin (ISO format)
          title: End Date
        description: Date de fin (ISO format)
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Recherche dans description ou détails
          title: Search
        description: Recherche dans description ou détails
      - name: cash_sensitive_operations
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: 'Si true : uniquement les actions caisse sensibles Epic 24 (preuves step-up, opérations spéciales).'
          title: Cash Sensitive Operations
        description: 'Si true : uniquement les actions caisse sensibles Epic 24 (preuves step-up, opérations spéciales).'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Get Audit Log V1 Admin Audit Log Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/admin/cash-sessions/fix-blocked-deferred:
    post:
      tags:
      - admin
      - admin
      summary: Corriger les sessions différées bloquées (Super Admin uniquement)
      description: Ferme ou supprime les sessions différées ouvertes qui sont bloquées (opened_at dans le passé).
      operationId: fix_blocked_deferred_sessions_v1_admin_cash_sessions_fix_blocked_deferred_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
  /v1/admin/cash-sessions/merge-duplicate-deferred:
    post:
      tags:
      - admin
      - admin
      summary: Fusionner les sessions différées dupliquées pour une même date (Super Admin uniquement)
      description: Ferme les sessions différées dupliquées (même opérateur, même date) en gardant seulement la première. Les
        ventes sont préservées.
      operationId: merge_duplicate_deferred_sessions_v1_admin_cash_sessions_merge_duplicate_deferred_post
      security:
      - HTTPBearer: []
      parameters:
      - name: operator_id
        in: query
        required: true
        schema:
          type: string
          description: ID de l'opérateur
          title: Operator Id
        description: ID de l'opérateur
      - name: date
        in: query
        required: true
        schema:
          type: string
          description: Date au format YYYY-MM-DD
          title: Date
        description: Date au format YYYY-MM-DD
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/admin/dashboard/stats:
    get:
      tags:
      - admin
      - dashboard
      - admin
      - dashboard
      summary: Get Dashboard Stats
      operationId: get_dashboard_stats_v1_admin_dashboard_stats_get
      security:
      - HTTPBearer: []
      parameters:
      - name: site_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filtrer les statistiques par site
          title: Site Id
        description: Filtrer les statistiques par site
      - name: date_from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Date de debut (ISO 8601)
          title: Date From
        description: Date de debut (ISO 8601)
      - name: date_to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Date de fin (ISO 8601)
          title: Date To
        description: Date de fin (ISO 8601)
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardStatsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/admin/db/export:
    post:
      tags:
      - admin
      - database
      summary: Export pg_dump binaire (.dump), SUPER_ADMIN + step-up PIN
      description: '**G-OA-01** (Story 16.3). **Autorité** : `require_super_admin_role()` (JWT Bearer ou cookie).

        **Contexte** : opération **globale instance** (connexion via `DATABASE_URL` serveur) ; pas de filtre site ni `ContextEnvelope`.

        **Step-up** : **obligatoire** — en-tête `X-Step-Up-Pin` (opération serveur `db.export`, constante `SENSITIVE_OPERATION_DB_EXPORT`).

        **Idempotency-Key** : **non exigé** côté serveur (réponse fichier binaire : pas de rejouabilité JSON stockée ;

        décision tracée — double clic = second export complet ; mitigation : step-up + rôle super-admin).

        **Audit** : `log_system_action` avec `AuditActionType.DB_EXPORT` (succès/échecs) — jamais d''URL DB ni secrets.

        '
      operationId: adminDbExportPost
      responses:
        '200':
          description: Successful Response
      security:
      - HTTPBearer: []
  /v1/admin/db/import:
    post:
      tags:
      - admin
      - database
      summary: Import pg_restore (.dump), SUPER_ADMIN + step-up + Idempotency-Key
      description: '**G-OA-01** (Story 16.3). **Autorité** : `require_super_admin_role()`.

        **Contexte** : restauration **base complète** instance (`DATABASE_URL`) ; pas de `ContextEnvelope`.

        **Step-up** : **obligatoire** (`X-Step-Up-Pin`, opération `db.import`).

        **Idempotency-Key** : **obligatoire** ; rejeu même clé + même fichier (nom + taille) → même réponse **200** ;

        clé réutilisée avec fichier différent → **409** `IDEMPOTENCY_KEY_CONFLICT`.

        **Audit** : `AuditActionType.DB_IMPORT` inchangé (`log_system_action`).

        '
      operationId: adminDbImportPost
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_import_database_v1_admin_db_import_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /v1/admin/db/purge-transactions:
    post:
      tags:
      - admin
      - database
      summary: Purge données transactionnelles, SUPER_ADMIN + step-up + Idempotency-Key
      description: '**G-OA-01** (Story 16.3). **Autorité** : `require_super_admin_role()`.

        **Contexte** : purge **globale** tables ventes/réception/caisse listées dans le handler ; pas de `ContextEnvelope`.

        **Step-up** : **obligatoire** (`db.purge_transactions`).

        **Idempotency-Key** : **obligatoire** ; rejeu même clé → même JSON **200**.

        **Audit** : `AuditActionType.DB_PURGE` via `log_system_action` (comptes supprimés, pas de PII).

        '
      operationId: adminDbPurgeTransactionsPost
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
  /v1/admin/email-logs:
    get:
      tags:
      - admin
      - observability
      summary: Liste des logs d'emails envoyés (admin, lecture transverse)
      description: '**G-OA-01** (Story 16.2). **Autorité** : `require_admin_role_strict()` (voir `adminTransactionLogsList`).

        Données via **serveur** `EmailLogService` — ne pas reproduire l''anti-pattern **client** legacy `emailLogService`

        (fetch parallèle, `localStorage`, baseUrl ad hoc ; 15.2 §5) : les futurs clients doivent consommer **uniquement**

        ce contrat `/v1/admin/email-logs` avec la même session que le reste de l''API v2 (Bearer/cookie).

        **Lecture transverse** ; rate limit 30/minute (**429**).

        '
      operationId: adminEmailLogsList
      security:
      - HTTPBearer: []
      parameters:
      - name: recipient_email
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filtrer par adresse email du destinataire
          title: Recipient Email
        description: Filtrer par adresse email du destinataire
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
