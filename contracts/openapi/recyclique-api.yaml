openapi: 3.1.0
info:
  title: Recyclique API v2
  version: 0.1.29-draft
  description: 'Fichier OpenAPI reviewable (draft) — **Piste B**.

    `Recyclique` est le writer canonique : la generation depuis le code FastAPI doit

    alimenter ce document (ou le remplacer) sans edition manuelle des chemins d''implementation.

    Chaque operation expose un `operationId` **stable** ; les manifests CREOS referencent

    ces identifiants via `data_contract.operation_id` (voir instruction contrats donnees).


    **Versionnement semver (draft)** : increment **minor** pour ajouts retro-compatibles

    (nouveaux champs optionnels, nouvelles operations non breaking). Increment **major** ou

    procedure **B4** (journal + refs manifests/tests) pour toute rupture de schéma public ou

    renommage d''`operationId`. Voir `contracts/README.md` et pivot gouvernance §0.1 B4.

    '
servers:
- url: /api
  description: Prefixe nominal v2 (ajuster selon deploiement)
tags:
- name: ModuleConfig
  description: 'Configuration JSON generique par site et `module_key` (liste blanche serveur).

    **API interne Recyclique** : non stable pour applications JARVOS externes tant que Story 9.6 n''est pas livree.

    '
paths:
  /:
    get:
      summary: Root
      description: Root endpoint
      operationId: root__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /health:
    get:
      summary: Health Check
      description: Health check endpoint
      operationId: health_check_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /v1/activity/ping:
    post:
      tags:
      - activity
      - activity
      summary: Enregistrer l'activité
      description: Endpoint de ping pour enregistrer l'activité en temps réel.
      operationId: activity_ping_v1_activity_ping_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
  /v1/admin/accounting-expert/cash-sessions/{cash_session_id}/dual-read-compare:
    get:
      tags:
      - admin
      - accounting-expert
      summary: Double lecture legacy vs journal canonique (Story 22.2)
      description: 'Rapport comparatif structuré (agrégats brownfield `sales` / `cash_sessions.total_sales` vs journal

        `payment_transactions`) pour pilotage cutover — ne supprime pas les lectures legacy.

        '
      operationId: accountingExpertDualReadCompare
      security:
      - HTTPBearer: []
      parameters:
      - name: cash_session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Cash Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DualReadCompareReport'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/admin/accounting-expert/global-accounts:
    get:
      tags:
      - admin
      - accounting-expert
      summary: Comptes globaux Paheko (paramétrage expert)
      operationId: accountingExpertGetGlobalAccounts
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalAccountsResponse'
      security:
      - HTTPBearer: []
      description: 'Stories **22.3** (fondation API), **23.3** (cockpit Peintre) et **9.10** (écarts clôture 658/758) — **SUPER_ADMIN**
        uniquement. Comptes globaux (`default_sales_account`, `cash_shortage_account`, `cash_surplus_account`, etc.), distincts

        de la config admin « simple » (Epic 9.6). Source vérité encaissements : `payment_transactions`,

        pas `sales.payment_method`.

        '
    patch:
      tags:
      - admin
      - accounting-expert
      summary: Mettre à jour les comptes globaux (step-up PIN requis)
      operationId: accountingExpertPatchGlobalAccounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GlobalAccountsPayload'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalAccountsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
      description: 'Stories **22.3** (fondation API) et **23.3** (cockpit Peintre) — mutation sensible : `X-Step-Up-Pin` obligatoire
        (`accounting.expert.mutation`), audit

        `accounting_global_settings_updated`.

        '
  /v1/admin/accounting-expert/payment-methods:
    get:
      tags:
      - admin
      - accounting-expert
      summary: Lister le référentiel des moyens de paiement (expert)
      operationId: accountingExpertListPaymentMethods
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PaymentMethodExpertResponse'
                type: array
                title: Response Accountingexpertlistpaymentmethods
      security:
      - HTTPBearer: []
      description: 'Stories **22.3** (fondation API) et **23.2** (cockpit Peintre) — SUPER_ADMIN. Lecture seule ; vérité des
        encaissements côté ventes : `payment_transactions`,

        pas `sales.payment_method`.

        '
    post:
      tags:
      - admin
      - accounting-expert
      summary: Créer un moyen de paiement (step-up PIN requis)
      operationId: accountingExpertCreatePaymentMethod
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentMethodCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethodExpertResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
      description: 'Stories **22.3** (fondation API) et **23.2** (cockpit Peintre) — mutation sensible : `X-Step-Up-Pin` obligatoire
        (`accounting.expert.mutation`); audit

        `accounting_payment_method_changed`.

