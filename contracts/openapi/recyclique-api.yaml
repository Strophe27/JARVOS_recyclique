        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountingRevisionDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
      description: 'Stories **22.3** (API) et **23.2**/**23.3** (Peintre, publication) — produit un `accounting_config_revisions.id`
        stable pour la chaîne canonique et le snapshot 22.6.

        Step-up PIN obligatoire ; audit `accounting_config_published`.

        '
  /v1/admin/accounting-expert/revisions/{revision_id}:
    get:
      tags:
      - admin
      - accounting-expert
      summary: Détail d'une révision (snapshot immuable)
      operationId: accountingExpertGetRevision
      security:
      - HTTPBearer: []
      parameters:
      - name: revision_id
        in: path
