      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountingRevisionSummary'
                title: Response Accountingexpertlistrevisions
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      description: Stories **22.3** (API) et **23.2**/**23.3** (Peintre) — liste paginée (`skip`, `limit`), la plus récente
        en premier.
  /v1/admin/accounting-expert/revisions/latest:
    get:
      tags:
      - admin
      - accounting-expert
      summary: Dernière révision comptable publiée
      operationId: accountingExpertGetLatestRevision
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountingRevisionDetail'
      security:
      - HTTPBearer: []
      description: Stories **22.3** (API) et **23.2**/**23.3** (Peintre) — SUPER_ADMIN ; inclut le snapshot immuable (comptes
