# Story 10.7 — manifeste machine-readable des gates release (PRD §13.0–13.2, §7.1).
version: 1
story: "10.7"
sprint_status_resync: true

gates:
  g_plancher:
    prd_section: "13.0"
    summary: "Socle L0 + C2b terrain validé avant le premier tag plancher v2.0.0 — distinct de beta interne et de G-vendable."
    non_confusable_with:
      - g_vendable
      - beta_interne
  beta_interne:
    prd_section: "13.1"
    summary: "Beta ressourcerie test : terrain, compta acceptable, modularité partielle, zéro fuite de contexte — sans tag vendable."
    non_confusable_with:
      - g_plancher
      - g_vendable
  g_vendable:
    prd_section: "13.2"
    summary: "V2 commercialisable : couches D complètes, HelloAsso minimum, install OS, ouverture communautaire."
    non_confusable_with:
      - g_plancher
      - beta_interne

release_gate_pillars:
  g_plancher:
    ac_refs: ["1", "2"]
  beta_interne:
    ac_refs: ["1", "2", "5"]
  g_vendable:
    ac_refs: ["1", "2"]
  mandatory_module_map:
    ac_refs: ["1", "2"]
  evidence_index:
    ac_refs: ["1", "5"]
  c2b_hitl_boundary:
    ac_refs: ["1", "2", "6"]

c2b_hitl:
  status: not_signed
  blocking_tag: v2.0.0
  note: "Validation terrain Coordinateur + PO (plan post-9.6 § C2b) — non signée au DS story 10.7."

criteria:
  g_plancher:
    - criterion_id: gp_socle_livre
      text: "Équivalence robuste avec 1.4.4 sur parcours déjà couverts : caisse, réception, compta/sync, 9.6 modules admin, 9.10 liaison clôture v1 (done au YAML)."
    - criterion_id: gp_c2b_terrain
      text: "Session HITL plan post-9.6 § C2b — obligatoire avant tag."
    - criterion_id: gp_tag_v200
      text: "v2.0.0 = premier tag plancher — interdit avant C2b validé (Coordinateur + PO) ; v2.0.1+ = modules métier L1 (un module à la fois)."
    - criterion_id: gp_non_confondu_vendable
      text: "G-plancher ne satisfait pas §13.2 (couches D complètes, HelloAsso au minimum vendable, etc.)."
  beta_interne:
    - criterion_id: bi_terrain_fiable
      text: "Scénarios nominaux et de dégradation critiques cashflow et reception flow exécutés sans défaut bloquant ouvert sur le contexte ou la perte de donnée."
    - criterion_id: bi_compta_acceptable
      text: "Scénarios critiques de sync/reconciliation documentés et vérifiés sur les parcours prioritaires."
    - criterion_id: bi_modularite_partielle
      text: "Bandeau live prouve la chaîne modulaire minimale et le passage d'un contrat CREOS au rendu effectif."
    - criterion_id: bi_zero_fuite_contexte
      text: "Aucun défaut critique détecté sur site, caisse, session, poste."
    - criterion_id: bi_preuve_scenarios_liste
      text: "Liste de scénarios critiques exécutés avec résultat documenté."
    - criterion_id: bi_preuve_fallback_quarantaine
      text: "Vérification explicite des comportements de fallback, blocage et quarantaine sur les parcours prioritaires."
    - criterion_id: bi_constats_terrain_ressourcerie
      text: "Constats terrain remontés sur au moins un contexte réel de ressourcerie test."
    - criterion_id: bi_preuve_caisse_compta_mixte
      text: "Preuve explicite sur paiements mixtes, don en surplus, gratuité, remboursement standard, remboursement sur exercice antérieur clos, snapshot de session et lot de synchronisation associé."
    - criterion_id: bi_epic_24_preuves
      text: "Lorsque le chantier operations speciales (Epic 24) est dans le périmètre de la release considérée : preuves documentées alignées sur epics.md Epic 24 et le PRD operations speciales."
    - criterion_id: bi_decision_epic_24_scope
      text: "Décision produit documentée : inclusion ou exclusion explicite d'Epic 24 dans le scope beta de la release ; si Epic 24 est hors scope, mention écrite « beta sans parcours operations speciales completes » dans les notes de gate."
    - criterion_id: bi_preuve_bandeau_module_manifest
      text: "Preuve documentée qu'un ModuleManifest, ses contributions de slot et son rendu nominal peuvent être validés sans convention locale non versionnée."
  g_vendable:
    - criterion_id: gv_terrain_fiable
      text: "Parcours cashflow, reception flow et cloture exécutés sur environnement supporté avec preuves documentées et sans défaut critique ouvert sur perte de donnée ou fuite de contexte."
    - criterion_id: gv_compta_propre
      text: "Politique de reconciliation explicite, parcours critiques vérifiés, traitement clair des écarts de sync."
    - criterion_id: gv_modularite_front_e2e
      text: "Preuves confirmées sur bandeau live, eco-organismes et adherents."
    - criterion_id: gv_zero_fuite_contexte
      text: "Aucun défaut critique sur les contextes sensibles."
    - criterion_id: gv_config_admin_minimale
      text: "Un responsable habilité peut modifier activation, ordre et variante simple sur environnement supporté, avec audit et sans redeploiement."
    - criterion_id: gv_installation_oss
      text: "Installation nominale documentée, reproductible et vérifiée sur environnement cible officiel, jusqu'au shell authentifié et au premier contexte exploitable."
    - criterion_id: gv_ouverture_communautaire
      text: "Contrats, documentation d'installation et guide de contribution minimum publiés de façon cohérente avec la gouvernance contractuelle."
    - criterion_id: gv_preuve_scenarios_caisse_reception
      text: "Scénarios critiques de caisse, reception, cloture et sync exécutés et documentés."
    - criterion_id: gv_preuve_modularite_bandeau_eco_adherents
      text: "Preuve explicite de la modularité sur bandeau live, eco-organismes et adherents."
    - criterion_id: gv_publication_matrice_env
      text: "Publication de la matrice d'environnements supportés et de la documentation d'installation associée."
    - criterion_id: gv_publication_navigateurs_a11y
      text: "Publication de la matrice navigateurs supportés et du niveau d'accessibilité cible."
    - criterion_id: gv_absence_defaut_critique
      text: "Absence de défaut critique ouvert sur fuite de contexte, blocage comptable ou perte de traçabilité."
    - criterion_id: gv_preuve_paheko_lot_session
      text: "Preuve documentée d'un lot de session complet, de sa reprise en cas d'échec et de l'absence de succès global implicite en cas d'application partielle côté Paheko."
    - criterion_id: gv_preuve_config_admin_change
      text: "Preuve documentée d'au moins un changement de configuration appliqué et tracé sans intervention technique hors procédure."

